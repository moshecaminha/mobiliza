<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%2300E5A8%27/%3E%3Cstop offset=%271%27 stop-color=%27%2300805F%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2764%27 height=%2764%27 rx=%2715%27 fill=%27url(%23g)%27/%3E%3Cpath d=%27M 13 50 L 13 22 L 22 13 L 32 25 L 42 13 L 51 22 L 51 50%27 stroke=%27%23fff%27 stroke-width=%275.5%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3Ccircle cx=%2742%27 cy=%2713%27 r=%274%27 fill=%27%23FFB800%27 stroke=%27%23fff%27 stroke-width=%271.5%27/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%2300E5A8%27/%3E%3Cstop offset=%271%27 stop-color=%27%2300805F%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2764%27 height=%2764%27 rx=%2715%27 fill=%27url(%23g)%27/%3E%3Cpath d=%27M 13 50 L 13 22 L 22 13 L 32 25 L 42 13 L 51 22 L 51 50%27 stroke=%27%23fff%27 stroke-width=%275.5%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3Ccircle cx=%2742%27 cy=%2713%27 r=%274%27 fill=%27%23FFB800%27 stroke=%27%23fff%27 stroke-width=%271.5%27/%3E%3C/svg%3E">
<meta name="theme-color" content="#00A878">
<title>MOBILIZZA.ORG · Administração</title>
<style>
:root{--navy:#0A1628;--brand:#00A878;--brand-2:#00805F;--gold-2:#D97706;--coral:#DC2626;--blue:#2563EB;--purple:#6D28D9;--bg:#F5F7FA;--card:#fff;--ink:#0F172A;--ink-2:#1E293B;--muted:#64748B;--border:#E2E8F0;--soft:#F8FAFC}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit;outline:none;color:var(--ink)}
.btn{background:var(--brand);color:#fff;padding:10px 16px;border-radius:9px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--brand-2)}
.btn.ghost{background:#fff;color:var(--ink-2);border:1px solid var(--border)}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{background:var(--coral);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;font-size:14px;background:#fff}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0A1628,#13213D 60%,#1A2C4F);padding:20px}
.login-card{background:#fff;border-radius:18px;padding:34px;width:400px;max-width:100%;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.logo{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#00E5A8,#00805F);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px}
#app{display:none;min-height:100vh}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10}
.tabs{display:flex;gap:6px;padding:14px 24px 0}
.tab{padding:9px 16px;border-radius:9px 9px 0 0;font-weight:700;font-size:13px;color:var(--muted)}
.tab.on{background:#fff;color:var(--ink);border:1px solid var(--border);border-bottom:none}
.wrap{padding:20px 24px;max-width:1200px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
.card h3{font-size:15px;margin-bottom:4px}
.sub{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px;border-bottom:1px solid var(--border)}
td{padding:9px 8px;border-bottom:1px solid var(--soft);vertical-align:middle}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.badge.admin{background:#EEF2FF;color:#4338CA}.badge.coord{background:#ECFDF5;color:#047857}.badge.assessor{background:#FEF3C7;color:#B45309}.badge.super{background:#FCE7F3;color:#BE185D}
.chip{display:inline-block;background:var(--soft);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:11px;margin:2px}
.grid{display:grid;gap:12px}
.kpi{background:var(--soft);border-radius:10px;padding:10px 12px;text-align:center}
.kpi .v{font-size:20px;font-weight:800}.kpi .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.modal-bg{position:fixed;inset:0;background:rgba(10,22,40,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;width:660px;max-width:100%;max-height:88vh;overflow-y:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;z-index:100;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.err{color:var(--coral);font-size:13px;margin-top:8px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px">
      <div class="logo">M</div>
      <div><div style="font-size:20px;font-weight:800">MOBILIZZA<span style="opacity:.55;font-weight:600">.org</span></div><div class="sub">Painel do administrador</div></div>
    </div>
    <label>E-mail</label>
    <input id="lg-email" type="email" placeholder="voce@email.com" autocomplete="username">
    <label>Senha</label>
    <input id="lg-pass" type="password" placeholder="••••••" autocomplete="current-password">
    <button class="btn" style="width:100%;justify-content:center;margin-top:16px" onclick="doLogin()">Entrar</button>
    <div id="lg-err" class="err"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="logo" style="width:36px;height:36px;font-size:18px;border-radius:9px">M</div>
    <div style="flex:1"><strong>MOBILIZZA<span style="opacity:.55;font-weight:600">.org</span></strong> <span class="sub">· Administração da plataforma</span></div>
    <span id="who" class="sub"></span>
    <button class="btn ghost sm" onclick="doLogout()">Sair</button>
  </div>
  <div class="tabs">
    <div class="tab on" id="tab-over" onclick="switchTab('over')">Visão geral</div>
    <div class="tab" id="tab-cand" onclick="switchTab('cand')">Candidatos</div>
    <div class="tab" id="tab-user" onclick="switchTab('user')">Usuários</div>
    <div class="tab" id="tab-gest" onclick="switchTab('gest')">Gestores</div>
  </div>
  <div class="wrap">
    <div id="view-over"></div>
    <div id="view-cand" style="display:none"></div>
    <div id="view-user" style="display:none"></div>
    <div id="view-gest" style="display:none"></div>
  </div>
</div>

<div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://dhxizqszipfnlpojzpbc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRoeGl6cXN6aXBmbmxwb2p6cGJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3NDgyNzYsImV4cCI6MjA5ODMyNDI3Nn0.Mb8IKH9MKumo4H4bag5iAjD7IXS8ogg9skKrCdvqV1M';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let SESSION = null;
let CACHE = { candidates: [], users: [], memberships: [] };
const OFFICES = {deputado_estadual:'Deputado Estadual',deputado_federal:'Deputado Federal',prefeito:'Prefeito',vereador:'Vereador',governador:'Governador',senador:'Senador',presidente:'Presidente'};

const esc = s => (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const $ = id => document.getElementById(id);
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
function money(v){ return 'R$ '+(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }

// Chama uma RPC do banco (gated por superadmin no servidor)
async function rpc(fn, args){
  const { data, error } = await sb.rpc(fn, args||{});
  if(error) throw new Error(error.message||('erro em '+fn));
  return data;
}

window.doLogin = async function(){
  const email=$('lg-email').value.trim(), password=$('lg-pass').value;
  $('lg-err').textContent='';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ $('lg-err').textContent = 'Login falhou: '+error.message; return; }
  SESSION = data.session;
  try { await enterApp(); }
  catch(e){ $('lg-err').textContent = e.message; await sb.auth.signOut(); }
};
window.doLogout = async function(){ await sb.auth.signOut(); location.reload(); };

async function enterApp(){
  CACHE.candidates = await rpc('mob_admin_candidates'); // barra quem não é superadmin
  $('who').textContent = SESSION.user.email;
  $('login').style.display='none';
  $('app').style.display='block';
  try{ await rpc('mob_activity_log',{ p_candidate:null, p_action:'acesso', p_entity:'painel-admin', p_detail:SESSION.user.email }); }catch(e){}
  renderOverview();
  renderCandidates();
  loadUsers();
}
window.switchTab = function(t){
  ['over','cand','user','gest'].forEach(function(k){
    $('tab-'+k).classList.toggle('on', t===k);
    $('view-'+k).style.display = t===k?'':'none';
  });
  if(t==='over') renderOverview();
  if(t==='gest') loadGestores();
};

// ---------------- VISÃO GERAL (somente leitura) ----------------
// Horário padronizado em Brasília (America/Sao_Paulo)
function brt(ts){ try{ return new Date(ts).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}); }catch(e){ return ''; } }
function num(v){ return (+v||0).toLocaleString('pt-BR'); }
async function renderOverview(){
  const list = CACHE.candidates||[];
  const selId = (CACHE.overFilter||'');
  const scope = selId ? list.filter(c=>c.id===selId) : list;
  // Agrega KPIs a partir do relatório já embutido em cada candidato
  const agg = {leaders:0,militants:0,leads:0,events:0,checkins:0,votes:0,income:0,expense:0,donations:0};
  scope.forEach(c=>{ const r=c.report||{}, f=r.finance||{};
    agg.leaders+=+r.leaders||0; agg.militants+=+r.militants||0; agg.leads+=+r.leads||0;
    agg.events+=+r.events||0; agg.checkins+=+r.checkins||0; agg.votes+=+r.votes_estimated||0;
    agg.income+=+f.income||0; agg.expense+=+f.expense||0; agg.donations+=+f.donations||0;
  });
  const bal = agg.income + agg.donations - agg.expense;
  const opts = '<option value="">Todos os candidatos ('+list.length+')</option>'+
    list.map(c=>'<option value="'+c.id+'"'+(c.id===selId?' selected':'')+'>'+esc(c.name)+'</option>').join('');
  let h = '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">'
    +'<div><h3>Visão geral da plataforma</h3><div class="sub">Somente leitura · consolidado de todas as campanhas · horário de Brasília</div></div>'
    +'<div style="display:flex;gap:8px;align-items:center"><label class="sub" style="text-transform:none">Filtrar:</label>'
    +'<select id="over-filter" onchange="setOverFilter(this.value)" style="padding:8px 10px;border:1px solid #e5e7eb;border-radius:8px">'+opts+'</select> '
    +'<button class="btn ghost sm" onclick="exportOverview()">⤓ Exportar CSV</button> '
    +'<button class="btn ghost sm" onclick="refreshOverview()">↻ Atualizar</button></div></div></div>';
  // KPIs gerais
  h += '<div class="card"><h3 style="margin-bottom:10px">Indicadores'+(selId?' · '+esc((list.find(c=>c.id===selId)||{}).name||''):'')+'</h3>'
    +'<div class="grid" style="grid-template-columns:repeat(6,1fr)">'
    +kpi(scope.length,'Campanhas')+kpi(num(agg.leaders),'Lideranças')+kpi(num(agg.militants),'Militantes')
    +kpi(num(agg.leads),'Leads')+kpi(num(agg.events),'Eventos')+kpi(num(agg.checkins),'Check-ins')
    +'</div><div class="grid" style="grid-template-columns:repeat(4,1fr);margin-top:10px">'
    +kpi(num(agg.votes),'Votos estimados')+kpi(money(agg.income),'Receitas')+kpi(money(agg.expense),'Despesas')+kpi(money(agg.donations),'Doações')
    +'</div></div>';
  // Área financeira consolidada (por candidato)
  h += '<div class="card"><h3>Financeiro consolidado</h3><div class="sub">Saldo = receitas + doações − despesas</div><div style="overflow-x:auto;margin-top:8px"><table><thead><tr><th>Candidato</th><th style="text-align:right">Receitas</th><th style="text-align:right">Doações</th><th style="text-align:right">Despesas</th><th style="text-align:right">Saldo</th></tr></thead><tbody>';
  scope.forEach(c=>{ const f=(c.report||{}).finance||{}; const sb=(+f.income||0)+(+f.donations||0)-(+f.expense||0);
    h+='<tr><td><strong>'+esc(c.name)+'</strong></td><td style="text-align:right">'+money(f.income)+'</td><td style="text-align:right">'+money(f.donations)+'</td><td style="text-align:right">'+money(f.expense)+'</td><td style="text-align:right;font-weight:700;color:'+(sb<0?'#dc2626':'#059669')+'">'+money(sb)+'</td></tr>';
  });
  h+='<tr style="border-top:2px solid #e5e7eb"><td><strong>TOTAL</strong></td><td style="text-align:right"><strong>'+money(agg.income)+'</strong></td><td style="text-align:right"><strong>'+money(agg.donations)+'</strong></td><td style="text-align:right"><strong>'+money(agg.expense)+'</strong></td><td style="text-align:right;font-weight:800;color:'+(bal<0?'#dc2626':'#059669')+'">'+money(bal)+'</td></tr>';
  h+='</tbody></table></div></div>';
  // Logs de usuários (com horário de Brasília)
  h += '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Logs de usuários</h3><span class="sub" id="over-log-count"></span></div><div class="sub">Acessos e ações recentes · horário de Brasília</div><div id="over-logs" style="margin-top:8px"><div class="sub">Carregando…</div></div></div>';
  $('view-over').innerHTML = h;
  loadOverviewLogs(selId);
}
window.setOverFilter = function(v){ CACHE.overFilter = v||''; renderOverview(); };
// Exporta o consolidado (respeitando o filtro por candidato) para planilha
window.exportOverview = function(){
  const list = CACHE.candidates||[];
  const selId = CACHE.overFilter||'';
  const scope = selId ? list.filter(c=>c.id===selId) : list;
  const head = ['candidato','cargo','uf','cidade','ano','liderancas','militantes','leads','eventos','checkins','votos_estimados','receitas','despesas','doacoes','saldo'];
  const rows = scope.map(c=>{ const r=c.report||{}, f=r.finance||{};
    const saldo=(+f.income||0)+(+f.donations||0)-(+f.expense||0);
    return [c.name, OFFICES[c.office]||c.office||'', c.uf||'', c.city||'', c.election_year||'',
            r.leaders||0, r.militants||0, r.leads||0, r.events||0, r.checkins||0, r.votes_estimated||0,
            (+f.income||0).toFixed(2), (+f.expense||0).toFixed(2), (+f.donations||0).toFixed(2), saldo.toFixed(2)];
  });
  const csv = [head].concat(rows).map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(';')).join('\n');
  const stamp = new Date().toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}).replace(/[/:]/g,'-').replace(/, /,'_');
  const blob = new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download = 'MOBILIZA_consolidado_'+stamp+'.csv'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('Relatório exportado');
};
window.refreshOverview = async function(){ CACHE.candidates = await rpc('mob_admin_candidates'); renderOverview(); toast('Atualizado'); };
async function loadOverviewLogs(candId){
  try{
    const rows = await rpc('mob_admin_activity',{ p_candidate: candId||null, p_limit: 300 });
    const box=$('over-logs'); const cnt=$('over-log-count');
    if(cnt) cnt.textContent = (rows||[]).length+' registros';
    if(!rows || !rows.length){ box.innerHTML='<div class="sub">Nenhum registro ainda. Os acessos e ações aparecerão aqui conforme o uso.</div>'; return; }
    const actLabel = a => ({acesso:'acessou',create:'criou',edit:'editou',delete:'excluiu'})[a]||a;
    let t='<div style="overflow-x:auto"><table><thead><tr><th>Quando (Brasília)</th><th>Usuário</th><th>Ação</th><th>Item</th><th>Campanha</th></tr></thead><tbody>';
    rows.forEach(a=>{ t+='<tr><td style="white-space:nowrap">'+brt(a.at)+'</td><td>'+esc(a.email||'—')+'</td><td>'+esc(actLabel(a.action))+'</td><td>'+esc((a.entity||'')+(a.detail?' · '+a.detail:''))+'</td><td>'+esc(a.candidate||'—')+'</td></tr>'; });
    t+='</tbody></table></div>';
    box.innerHTML=t;
  }catch(e){ $('over-logs').innerHTML='<div class="card err">'+esc(e.message)+'</div>'; }
}

// ---------------- CANDIDATOS ----------------
async function refreshCandidates(){ CACHE.candidates = await rpc('mob_admin_candidates'); renderCandidates(); }
function kpi(v,l){ return '<div class="kpi"><div class="v">'+(v??0)+'</div><div class="l">'+l+'</div></div>'; }

function renderCandidates(){
  const list = CACHE.candidates||[];
  let h = '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><h3>Candidatos ('+list.length+')</h3><div class="sub">Cada candidato é uma base isolada. Veja os dados, gerencie a equipe ou exclua.</div></div><button class="btn" onclick="modalCandidate()">+ Novo candidato</button></div></div>';
  if(!list.length){ h += '<div class="card sub">Nenhum candidato ainda. Crie o primeiro.</div>'; $('view-cand').innerHTML=h; return; }
  list.forEach(c=>{
    const rep=c.report||{}, f=rep.finance||{};
    const team=(c.team||[]).map(m=>'<span class="chip">'+esc(m.email||'?')+' · '+m.role+'</span>').join(' ')||'<span class="sub">sem equipe</span>';
    h += '<div class="card">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">'
        +'<div style="display:flex;gap:12px;align-items:center">'
          +'<div style="width:46px;height:46px;border-radius:12px;background:'+(esc(c.theme_color||'#00A878'))+';display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;overflow:hidden">'+(c.photo_url?'<img src="'+esc(c.photo_url)+'" style="width:100%;height:100%;object-fit:cover">':esc((c.name||'?').slice(0,1).toUpperCase()))+'</div>'
          +'<div><div style="font-weight:800;font-size:15px">'+esc(c.name)+' <span class="sub">'+(c.party_number?'· '+esc(c.party_number):'')+'</span></div>'
          +'<div class="sub">'+(OFFICES[c.office]||esc(c.office||'—'))+' · '+esc(c.uf||'')+(c.city?'/'+esc(c.city):'')+' · '+c.election_year+'</div></div>'
        +'</div>'
        +'<div style="display:flex;gap:6px;flex-wrap:wrap">'
          +'<button class="btn ghost sm" onclick="viewData(\''+c.id+'\')">Ver dados</button>'
          +'<button class="btn ghost sm" onclick="manageTeam(\''+c.id+'\')">Equipe</button>'
          +'<button class="btn ghost sm" onclick="modalCandidate(\''+c.id+'\')">Editar</button>'
          +'<button class="btn danger sm" onclick="delCandidate(\''+c.id+'\',\''+esc(c.name).replace(/\x27/g,"")+'\')">Excluir</button>'
        +'</div>'
      +'</div>'
      +'<div class="grid" style="grid-template-columns:repeat(6,1fr);margin-top:14px">'
        +kpi(rep.leaders,'Lideranças')+kpi(rep.militants,'Militantes')+kpi(rep.leads,'Leads')
        +kpi(rep.events,'Eventos')+kpi(rep.checkins,'Check-ins')+kpi((rep.votes_estimated||0).toLocaleString('pt-BR'),'Votos est.')
      +'</div>'
      +'<div class="grid" style="grid-template-columns:repeat(3,1fr);margin-top:10px">'
        +kpi(money(f.income),'Receitas')+kpi(money(f.expense),'Despesas')+kpi(money(f.donations),'Doações')
      +'</div>'
      +'<div style="margin-top:12px">'+team+'</div>'
    +'</div>';
  });
  $('view-cand').innerHTML = h;
}

window.uploadCandPhoto = async function(files, id){
  if(!files || !files.length) return;
  const f = files[0];
  const st = $('c-photo-status'); if(st) st.textContent = 'Enviando…';
  try{
    const folder = id || (crypto.randomUUID ? crypto.randomUUID() : (Date.now()+''+Math.random()).replace(/\D/g,''));
    const ext = (f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
    const path = folder+'/photo_'+Date.now()+'.'+ext;
    const up = await sb.storage.from('candidate-photos').upload(path, f, {contentType:f.type||undefined, upsert:true});
    if(up.error) throw new Error(up.error.message||'falha no upload');
    const pub = sb.storage.from('candidate-photos').getPublicUrl(path);
    const url = pub.data.publicUrl;
    $('c-photo').value = url;
    const prev = $('c-photo-prev'); if(prev){ prev.src = url; prev.style.display=''; }
    if(st) st.textContent = 'Foto enviada';
  }catch(e){ if(st) st.textContent = 'Erro: '+(e.message||''); }
};

  if(!email){ toast('E-mail obrigatório'); return; }
  if(!editing && password.length<6){ toast('Senha do primeiro acesso (6+) obrigatória'); return; }
  const ids=[...document.querySelectorAll('.gest-cand:checked')].map(x=>x.value);
  if(!ids.length && !confirm('Nenhum candidato selecionado — o gestor ficará sem acesso a candidato algum. Continuar?')) return;
  try{
    await rpc('mob_admin_gestor_save',{ p_email:email, p_password:password, p_name:name, p_candidate_ids:ids });
    closeModal(); toast(editing?'Gestor atualizado':'Gestor criado'); loadGestores();
  }catch(e){ toast(e.message); }
};
window.delGestor=async function(uid,email){
  if(!confirm('Remover o acesso de gestor de '+email+'? A conta continua existindo, mas deixa de administrar candidatos.')) return;
  try{ await rpc('mob_admin_gestor_delete',{ p_user_id:uid }); toast('Acesso de gestor removido'); loadGestores(); }catch(e){ toast(e.message); }
};

// ---------------- util ----------------
function showModal(html){ $('modal').innerHTML=html; $('modal-bg').classList.add('show'); }
window.closeModal=function(){ $('modal-bg').classList.remove('show'); };
$('modal-bg').addEventListener('click',e=>{ if(e.target===$('modal-bg')) closeModal(); });
$('lg-pass').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });

(async()=>{ const { data } = await sb.auth.getSession(); if(data.session){ SESSION=data.session; try{ await enterApp(); }catch(e){} } })();
</script>
